name: Deploy console parent (GitHub Pages)

# Déploie la console parent (apps/parent-web) sur GitHub Pages à chaque push sur main.
# La clé Supabase utilisée est la clé PUBLISHABLE (publique par conception — déjà
# présente dans apps/parent-web/.env.example) : AUCUN secret n'est requis.
# Les données restent protégées par l'authentification Supabase + la RLS.

on:
  push:
    branches: [main]
    paths:
      - "apps/parent-web/**"
      - ".github/workflows/deploy-parent-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on annule une publication en cours devenue obsolète.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/parent-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/parent-web/package-lock.json
      - run: npm ci
      - name: Build (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://xjfuaszukuumqxgzitzq.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_BJow0lDQQdmoiiDE1JUXYg_9Dw_DnBI
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/parent-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
